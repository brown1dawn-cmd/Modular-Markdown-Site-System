<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{page_description}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="stylesheet" href="/assets/css/site.css">
  <title>{{page_title}} — {{site_name}}</title>
</head>
<body class="page page--{{template}}">
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header"><a class="wordmark" href="/{{lang}}/index.html" aria-label="{{site_name}} home"><span class="wordmark-mark">M</span><span>{{site_name}}</span></a><nav class="site-nav" aria-label="Primary navigation">{{nav}}</nav><div class="header-tools"><a class="lang-switch" href="{{lang_url}}" data-lang-switch>{{lang_label}}</a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav">Menu</button></div></header>
  <div id="mobile-nav" class="mobile-nav" hidden>{{nav}}</div>
  <main>
    <section class="hero hero--home"><div class="hero-orbit" aria-hidden="true"></div><div class="hero-copy"><p class="eyebrow"><!-- region:eyebrow --><!-- endregion --></p><div class="region region--hero"><!-- region:hero --><!-- endregion --></div></div><div class="hero-side-note"><span>MODULAR / 01</span><span>CONTENT AS INFRASTRUCTURE</span></div></section><section class="section section--features"><div class="section-kicker">/ 01 &nbsp; System notes</div><div class="region region--features"><!-- region:features --><!-- endregion --></div></section><section class="section section--cta"><div class="cta-panel"><div class="region"><!-- region:cta --><!-- endregion --></div><a class="circle-arrow" href="/{{lang}}/contact.html" aria-label="Contact">↗</a></div></section>
  </main>
  <footer class="site-footer"><div><a class="wordmark" href="/{{lang}}/index.html"><span class="wordmark-mark">M</span><span>{{site_name}}</span></a><p>{{footer_line}}</p></div><div class="footer-meta"><span>© {{year}}</span><span>Built from Markdown</span></div></footer>
  <script src="/assets/js/nav.js" defer></script><script src="/assets/js/i18n.js" defer></script>
</body>
</html>
